name: PR screen preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build screen preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_CATALOG_SNAPSHOT_ONLY: "1"
          VITE_PREVIEW_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm preview:build

      - name: Publish PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          source-dir: ./preview-dist/
          preview-branch: gh-pages
          qr-code: true
          wait-for-pages-deployment: true
